# Hierarchical Energy Palettes Specification
# Version: 0.1.0
# References:
#   IPCC 2006 Guidelines (Vol.2 Energy) https://www.ipcc-nggip.iges.or.jp/public/2006gl/
#   IEA World Energy Balances https://www.iea.org/data-and-statistics
#   EIA Fuel Categories https://www.eia.gov/
#   IRENA / REN21 Renewable Classifications
#
# Structure:
# top-level keys: carriers, technologies, metadata
# - carriers: primary energy carriers and their subtypes (fuel taxonomy)
# - technologies: power-generation & conversion technologies
# - metadata: references and notes

# Default palette structure and colors
carriers:
  FossilFuels:
    _color: "#555555"  # Aggregate fossil group color (neutral dark gray)
    _short: Fossil
    _long: Fossil Fuels
    FossilCoal:
      _color: "#2C2C2C"
      _short: Coal
      _long: Coal
      subtypes:
        Anthracite: "#1E1E1E"
        Bituminous: "#343434"
        SubBituminous: "#4A4A4A"
        Lignite: "#5C5C5C"
        Coke: "#3A3A3A"
        OtherFossilCoal: "#2C2C2C"
    FossilOil:
      _color: "#8B4513"
      _short: Oil
      _long: Oil
      subtypes:
        Crude: "#8B4513"
        ResidualFuelOil: "#7A3E12"
        DistillateFuelOil: "#9A4F19"
        MotorGasoline: "#A85A1F"
        JetFuel: "#95501B"
        LPG_NGL: "#B16528"
        OtherFossilOil: "#8B4513"
    FossilGas:
      _color: "#4682B4"
      _short: Gas
      _long: Natural Gas
      subtypes:
        NaturalGas: "#4682B4"
        ShaleGas: "#4F8CBE"
        TightGas: "#5A96C8"
        LNG: "#639FD1"
        AssociatedGas: "#6DA8DB"
        OtherFossilGas: "#4682B4"
  Renewable:
    _color: "#0FAF3F"  # Aggregate renewable green
    _short: RE
    _long: Renewables
    Bioenergy:
      _color: "#228B22"
      _short: Bio
      _long: Bioenergy
      subtypes:
        SolidBiomass: "#228B22"
        Biogas: "#32CD32"
        Ethanol: "#3DCB3D"
        Biodiesel: "#40D240"
        Waste: "#4AA04A"
        OtherBioenergy: "#228B22"
    Hydro:
      _color: "#0080FF"
      _short: Hydro
      _long: Hydroelectric Power
      subtypes:
        LargeHydro: "#0080FF"
        SmallHydro: "#3399FF"
        RunOfRiver: "#1A8BFF"
        PumpedStorage: "#20B2AA"
        OtherHydro: "#0080FF"
    Wind:
      _color: "#87CEEB"
      _short: Wind
      _long: Wind
      subtypes:
        Onshore: "#87CEEB"
        Offshore: "#6BB7D6"
        OtherWind: "#87CEEB"
    Solar:
      _color: "#FFA500"
      _short: Solar
      _long: Solar
      subtypes:
        SolarPV: "#FFA500"
        CSP: "#FFB347"
        SolarThermal: "#FFC166"
        OtherSolar: "#FFA500"
    Geothermal:
      _color: "#CD853F"
      _short: Geo
      _long: Geothermal
      subtypes:
        Hydrothermal: "#CD853F"
        EGS: "#B27336"
        OtherGeothermal: "#CD853F"
    OtherRenewables:
      _color: "#32CD32"
      _short: Other RE
      _long: Other Renewables
      subtypes:
        Wave: "#2EBB2E"
        Tidal: "#28A828"
        OceanThermal: "#249624"
        OtherOtherRenewables: "#32CD32"
  Nuclear:
    _color: "#FFD700"  # Aggregate nuclear (matches core nuclear color)
    _short: Nuclear
    _long: Nuclear
    Nuclear:
      _color: "#FFD700"
      _short: Nuclear
      _long: Nuclear
      subtypes:
        PWR: "#FFD700"
        BWR: "#E6C300"
        SMR: "#D4B000"
        OtherNuclear: "#FFD700"
  Electricity:
    _color: "#1F4BA8"  # Placeholder electricity energy carrier color (review)
    _short: Elec
    _long: Electricity
    Electricity:
      _color: "#1F4BA8"
      _short: Elec
      _long: Electricity
      subtypes: {}
      # No subtypes defined; placeholder Other removed as not applicable
  Heat:
    _color: "#CC5500"  # Placeholder heat carrier color (review / adjust for contrast)
    _short: Heat
    _long: Heat
    Heat:
      _color: "#CC5500"
      _short: Heat
      _long: Heat
      subtypes: {}
      # No subtypes defined; placeholder Other removed as not applicable
  Synthetic:
    _color: "#B06A23"  # Aggregate synthetic fuels family (warm brown-orange)
    _short: Synthetic
    _long: Synthetic Fuels
    Hydrogen:
      _color: "#00B5E2"
      _short: H2
      _long: Hydrogen
      subtypes:
        GreenHydrogen: "#00B5E2"
        BlueHydrogen: "#0099C4"
        GreyHydrogen: "#7F9FAA"
        PinkHydrogen: "#C26FBF"
        TurquoiseHydrogen: "#1CA6A6"
        OtherHydrogen: "#00B5E2"
    HydrogenDerivatives:
      _color: "#008FB4"
      _short: H2 Deriv.
      _long: Hydrogen Derivatives
      subtypes:
        Ammonia: "#008FB4"
        MethanolSynthetic: "#27A7C8"
        LOHC: "#1E8296"
        OtherHydrogenDerivatives: "#008FB4"
    SyntheticFuels:
      _color: "#B5651D"
      _short: SynFuels
      _long: Synthetic Fuels
      subtypes:
        eMethane: "#C27730"
        eMethanol: "#CE8542"
        eDiesel: "#A85915"
        eJetFuel: "#9E5210"
        FT_Liquids: "#B06A23"
        OtherSyntheticFuels: "#B5651D"
  Storage:
    _color: "#9370DB"  # Standalone storage category (moved from Other)
    _short: Storage
    _long: Energy Storage
    Storage:
      _color: "#9370DB"
      _short: Storage
      _long: Energy Storage
      subtypes:
        Battery: "#9370DB"
        Hydrogen: "#8A67D2"
        ThermalStorage: "#7E5BC6"
        OtherStorage: "#9370DB"
  Other:
    _color: "#808080"  # Aggregate other / miscellaneous group
    _short: Other
    _long: Other
    Other:
      _color: "#C0C0C0"
      _short: Other
      _long: Other
      subtypes: {}      

technologies:
  ElectricPower:
    _short: Power
    _long: Electric Power Generation
    CoalFired:
      _color: "#2C2C2C"          # base coal color
      _short: Coal Gen
      _long: Coal-Fired Generation
      subtypes:
        PulverizedSubCritical: "#2C2C2C"
        PulverizedSuperCritical: "#343434"
        UltraSuperCritical: "#1E1E1E"
        CirculatingFluidizedBed: "#4A4A4A"
        IGCC: "#3A3A3A"          # Integrated Gasification Combined Cycle (coal-based)
    GasFired:
      _color: "#4682B4"          # base gas color
      _short: Gas Gen
      _long: Gas-Fired Generation
      subtypes:
        SimpleCycleGT: "#5A96C8"  # Open cycle gas turbine
        CombinedCycleCCGT: "#4682B4"
        ReciprocatingEngine: "#4F8CBE"
        LNGImportTerminal: "#639FD1"  # infrastructure related (optional)
        HydrogenBlendCCGT: "#6DA8DB"  # emerging tech (hydrogen blend)
    # Placeholders for future nested groups (retain prior color inspirations)
    Nuclear:
      _color: "#FFD700"
      _short: Nuclear
      _long: Nuclear Generation
      subtypes:
        PWR: "#FFD700"
        BWR: "#E6C300"
    Biomass:
      _color: "#228B22"
      _short: Biomass Gen
      _long: Biomass Generation
      subtypes:
        Combustion: "#228B22"
        WasteToEnergy: "#556B2F"
    Hydro:
      _color: "#0080FF"
      _short: Hydro Gen
      _long: Hydroelectric Generation
      subtypes:
        Turbine: "#0080FF"
        PumpedStorage: "#20B2AA"
    Wind:
      _color: "#87CEEB"
      _short: Wind Gen
      _long: Wind Generation
      subtypes:
        Onshore: "#87CEEB"
        Offshore: "#6BB7D6"
    Solar:
      _color: "#FFA500"
      _short: Solar Gen
      _long: Solar Generation
      subtypes:
        PV: "#FFA500"
        CSP: "#FFB347"
    Geothermal:
      _color: "#CD853F"
      _short: Geo Gen
      _long: Geothermal Generation
      subtypes:
        Flash: "#CD853F"
        Binary: "#B27336"
    Storage:
      _color: "#9370DB"
      _short: Storage
      _long: Energy Storage (Tech)
      subtypes:
        Battery: "#9370DB"
        Hydrogen: "#8A67D2"
        Thermal: "#7E5BC6"

  # IEA / IPCC sectoral demand & transformation groupings (provisional colors)
  Industry:
    _color: "#546575"            # Base industry neutral blue-gray
    _short: Industry
    _long: Industry
    subtypes:
      IronAndSteel: "#455463"     # Darker for heavy industry
      Refineries: "#5E6F80"       # Slightly lighter (links to oil processing)
      NonFerrousMetals: "#4F6070"
      ChemicalsPetrochemicals: "#607282"
      Cement: "#495863"
      PulpAndPaper: "#647786"
      FoodAndTobacco: "#586A78"
      Machinery: "#5B6D7B"
      Mining: "#4A5966"
      Construction: "#526171"
      OtherIndustry: "#546575"

  Transport:
    _color: "#0E8484"            # Base transport teal
    _short: Transport
    _long: Transport
    subtypes:
      Road: "#0E8484"
      Rail: "#107F91"
      Aviation: "#1594A4"
      Shipping: "#0D6F75"
      Pipelines: "#0F7A7A"
      OtherTransport: "#0E8484"

  Buildings:
    _color: "#A97142"            # Warm earthy tone for buildings
    _short: Buildings
    _long: Buildings
    subtypes:
      Residential: "#A97142"
      CommercialPublic: "#B37B4C"
      OtherBuildings: "#A97142"

  AgricultureForestryFishing:
    _color: "#6B8E23"            # Olive green for land-based sectors
    _short: AFF
    _long: Agriculture, Forestry & Fishing
    subtypes:
      Agriculture: "#6B8E23"
      Forestry: "#5F7F1F"
      Fishing: "#779B2A"
      OtherAFF: "#6B8E23"

  EnergyTransformation:
    _color: "#6A5ACD"            # Slate purple for conversion processes
    _short: Transform
    _long: Energy Transformation
    subtypes:
      OilRefining: "#6A5ACD"      # Aligns with refineries but distinct from Industry::Refineries
      CokeOvens: "#594BB5"
      GasWorks: "#7769D4"
      Liquefaction: "#5E50C2"
      GasProcessing: "#7D71D8"
      HydrogenElectrolysis: "#847AD9"
      OtherTransformation: "#6A5ACD"

  NonEnergyUse:
    _color: "#556B8C"            # Desaturated blue for non-energy products
    _short: NonEnergy
    _long: Non-Energy Use
    subtypes:
      PetrochemicalFeedstocks: "#4B607E"
      Lubricants: "#5E7393"
      Waxes: "#516685"
      Asphalt: "#495E7A"
      OtherNonEnergyUse: "#556B8C"

metadata:
  version: "0.1.1"
  created: "2025-09-15"
  license: "MIT"
  notes: |
    Colors are provisional and designed to maintain visual continuity with existing iea_primary palette.
    Subtype shades are adjusted primarily via lightness shifts; further refinement may include perceptual
    uniformity adjustments (e.g., OKLCH) and color-blind safety evaluation.
    v0.1.1: Added sectoral technology groupings (Industry, Transport, Buildings, AgricultureForestryFishing,
            EnergyTransformation, NonEnergyUse) with provisional color assignments.
  references:
    - IPCC 2006 Guidelines for National Greenhouse Gas Inventories
    - IEA World Energy Balances
    - EIA Fuel Category Definitions
    - IRENA Technology Classifications
    - REN21 Global Status Report
